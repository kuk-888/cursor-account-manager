<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号管理 · 界面预览</title>
  <link rel="stylesheet" href="media/webview.css">
  <style>
    body{display:flex;flex-direction:column;background:#07090d}
    .previewBar{flex:none;padding:10px 14px;background:#0b0e14;border-bottom:1px solid #30394a;color:#9aa4b8;font:12px/1.4 sans-serif}
    .previewBar b{color:#ecf2ff}
    .stage{flex:1;min-height:0;display:flex;justify-content:center;padding:16px}
    .phone{width:360px;max-width:100%;height:min(760px, calc(100vh - 72px));border:1px solid #30394a;border-radius:12px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35)}
    #app{height:100%}
  </style>
</head>
<body>
  <div class="previewBar">这是<strong>界面预览</strong>。可点邮箱复制、导出/导入看弹窗。不会真切号、也不会写备份文件。</div>
  <div class="stage"><div class="phone"><div id="app"></div></div></div>
  <script>
    const previewState = {
        version: '2.2.7-preview',
      sand: { patched: false, version: '3.4.20', sand: 0, unpatched: 5, error: '' },
      account: { email: 'main@example.com', label: 'g', plan: 'ultra', planLabel: 'Ultra', enabled: true },
      accounts: [
        {
          id: 'acc_demo1', email: 'main@example.com', userTail: 'a1b2c3d4', type: 'ultra',
          isCurrent: true, used: 40000, limit: 40000, usageBased: false, hardLimit: null,
          autoPercent: 66.7, otherPercent: 100, botPercent: 89.4, botHasLimit: true,
          cycleEnd: new Date(Date.now() + 24 * 86400000).toISOString(),
          botResetAt: new Date(Date.now() + 3 * 86400000).toISOString(),
          sessionCount: 1, note: '主力',
          addedAt: new Date(Date.now() - 4 * 3600 * 1000).toISOString(), tokenType: 'client', noRefresh: false, source: 'deeplogin'
        },
        {
          id: 'acc_demo2', email: 'alt@example.com', userTail: '9f8e7d6c', type: 'pro',
          isCurrent: false, used: 8000, limit: 20000, usageBased: true, hardLimit: null,
          autoPercent: 41, otherPercent: 18, botPercent: 12.5, botHasLimit: true,
          cycleEnd: new Date(Date.now() + 11 * 86400000).toISOString(),
          botResetAt: new Date(Date.now() + 6 * 86400000).toISOString(),
          sessionCount: 2, note: '备用 Pro',
          addedAt: new Date(Date.now() - 86400 * 1000 * 2).toISOString(), tokenType: 'client', noRefresh: false, source: 'deeplogin'
        },
        {
          id: 'acc_demo3', email: 'web-only@example.com', userTail: '11223344', type: 'free',
          isCurrent: false, used: 0, limit: 0, usageBased: false, hardLimit: null,
          autoPercent: 8, otherPercent: 0, botPercent: null, botHasLimit: false,
          sessionCount: 0, note: '',
          addedAt: new Date(Date.now() - 86400 * 1000 * 3).toISOString(), tokenType: 'web', noRefresh: true, source: 'cookie'
        }
      ]
    };
    function pushPreviewState() {
      window.postMessage({ type: 'state', state: previewState }, '*');
    }
    window.acquireVsCodeApi = function () {
      return {
        postMessage: function (msg) {
          if (msg && msg.type === 'ready') return;
          const t = document.querySelector('.previewBar');
          if (msg && msg.type === 'accountImportAll') {
            window.postMessage({
              type: 'importPreview',
              fileName: 'cursor-accounts-demo.json',
              added: 1,
              updated: 2,
              rows: previewState.accounts.map(function (x, i) {
                return {
                  email: x.email,
                  userTail: x.userTail,
                  note: x.note || '',
                  tokenType: x.tokenType,
                  action: i === 2 ? 'add' : 'update'
                };
              })
            }, '*');
            if (t) t.innerHTML = '预览：已打开导入预览（演示数据，不会写文件）';
            return;
          }
          if (msg && (msg.type === 'accountExportAll' || msg.type === 'accountImportConfirm' || msg.type === 'accountImportCancel')) {
            if (t) t.innerHTML = '预览：已拦截 <b>' + msg.type + '</b>（不会读写备份文件）';
            return;
          }
          if (msg && (msg.type === 'copyText' || msg.type === 'accountCopyEmail' || msg.type === 'accountCopyToken')) {
            const text = msg.type === 'copyText' ? String(msg.text || '') : (msg.type === 'accountCopyToken' ? 'demo-token' : '');
            if (t) t.innerHTML = '预览：已复制 <b>' + (text || msg.type) + '</b>（浏览器剪贴板未写）';
            return;
          }
          if (msg && msg.type === 'accountSetNote') {
            const acc = previewState.accounts.find((x) => x.id === msg.id);
            if (acc) acc.note = String(msg.note || '').replace(/\s+/g, ' ').trim().slice(0, 24);
            if (t) t.innerHTML = '预览：已保存备注 <b>' + (acc && acc.note ? acc.note : '（已清除）') + '</b>';
            pushPreviewState();
            return;
          }
          if (t) t.innerHTML = '预览模式已拦截：<b>' + (msg && msg.type || '') + '</b>（不会写 Cursor 登录态）';
        }
      };
    };
  </script>
  <script src="media/webview.js"></script>
  <script>pushPreviewState();</script>
</body>
</html>
