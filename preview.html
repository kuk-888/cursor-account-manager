<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Account Manager · 界面预览</title>
  <link rel="stylesheet" href="media/webview.css">
  <style>
    body{display:flex;flex-direction:column}
    .previewBar{flex:none;padding:10px 14px;background:#0b0e14;border-bottom:1px solid #30394a;color:#9aa4b8;font:12px/1.4 sans-serif}
    .previewBar b{color:#ecf2ff}
    #app{flex:1;min-height:0}
  </style>
</head>
<body>
  <div class="previewBar">这是<strong>界面预览</strong>，按钮不会真切号。真功能请把 VSIX 装进本机 Cursor。</div>
  <div id="app"></div>
  <script>
    window.acquireVsCodeApi = function () {
      return {
        postMessage: function (msg) {
          const t = document.querySelector('.previewBar');
          if (t) t.innerHTML = '预览模式已拦截：<b>' + (msg && msg.type || '') + '</b>（不会写 Cursor 登录态）';
        }
      };
    };
  </script>
  <script src="media/webview.js"></script>
  <script>
    window.postMessage({
      type: 'state',
      state: {
        version: '5.3.5-preview',
        sand: {
          patched: true, version: '3.4.20', sand: 5, unpatched: 0, error: '',
          commands: {
            apply: "node '/path/sandCli.js' apply --app-root '/Applications/Cursor.app/Contents/Resources/app'",
            restore: "node '/path/sandCli.js' restore --force --app-root '/Applications/Cursor.app/Contents/Resources/app' --state-root '$HOME/Library/Application Support/Cursor/User/globalStorage/local.cursor-account-manager'"
          }
        },
        account: {
          email: 'you@example.com',
          label: 'you',
          plan: 'ultra',
          planLabel: 'Ultra',
          usageShort: 'A67 O100 B88',
          usageText: 'A67 O100 B88',
          usagePct: 67,
          loading: false,
          error: '',
          enabled: true
        },
        accounts: [
          {
            id: 'acc_demo1', email: 'you@example.com', userTail: 'a1b2c3d4', type: 'ultra',
            isCurrent: true, used: 40000, limit: 40000, usageBased: false, hardLimit: null,
            autoPercent: 66.7, otherPercent: 100, botPercent: 88.4, botHasLimit: true,
            cycleEnd: new Date(Date.now() + 25 * 86400000).toISOString(),
            botResetAt: new Date(Date.now() + 4 * 86400000).toISOString(),
            sessionCount: 1,
            addedAt: new Date(Date.now() - 3600 * 1000).toISOString(), tokenType: 'client', noRefresh: false, source: 'deeplogin'
          },
          {
            id: 'acc_demo2', email: 'alt@example.com', userTail: '9f8e7d6c', type: 'free',
            isCurrent: false, used: 0, limit: 0, usageBased: false, hardLimit: null,
            autoPercent: 11, otherPercent: 0, botPercent: null, botHasLimit: false,
            sessionCount: 0,
            addedAt: new Date(Date.now() - 86400 * 1000 * 3).toISOString(), tokenType: 'web', noRefresh: true, source: 'cookie'
          }
        ]
      }
    }, '*');
  </script>
</body>
</html>
